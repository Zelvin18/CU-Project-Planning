<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140">
  <!-- MTN oval background -->
  <ellipse cx="110" cy="70" rx="105" ry="62" fill="#FFCC00"/>
  <!-- MTN text -->
  <text x="110" y="90" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="58" 
        font-weight="900" 
        fill="#FFCC00" 
        text-anchor="middle"
        stroke="#FFCC00"
        stroke-width="1">MTN</text>
  <!-- Oval ring -->
  <ellipse cx="110" cy="70" rx="105" ry="62" fill="none" stroke="#FFCC00" stroke-width="7"/>
  <!-- Redraw text in white background oval then yellow text on white -->
  <ellipse cx="110" cy="70" rx="98" ry="55" fill="white"/>
  <text x="110" y="92" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="60" 
        font-weight="900" 
        fill="#FFCC00" 
        text-anchor="middle">MTN</text>
</svg>
